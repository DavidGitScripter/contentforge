<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ContentForge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230369a1'/><path d='M9 21l5-10 4 7 2-3 3 6' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Hauptnavigation">
      <a class="sidebar-brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M9 21l5-10 4 7 2-3 3 6"/></svg>
        <span><span class="brand-name">ContentForge</span><span class="brand-sub">Content-Pipeline</span></span>
      </a>
      <nav class="nav-scroll" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-env" aria-live="off"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Navigation öffnen"></button>
        <nav class="breadcrumb" id="breadcrumb" aria-label="Brotkrumen"></nav>
        <form class="search" id="search-form" role="search">
          <label class="sr-only" for="search">Vorgänge nach Keyword durchsuchen</label>
          <input id="search" type="search" placeholder="Keyword suchen" autocomplete="off" enterkeyhint="search">
          <kbd aria-hidden="true">/</kbd>
        </form>
        <a class="user-chip" id="user-chip" href="#/system?profil"></a>
      </header>
      <main class="content" id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="dialog" id="dialog"></dialog>
  <noscript>ContentForge benötigt JavaScript.</noscript>
</body>
</html>
